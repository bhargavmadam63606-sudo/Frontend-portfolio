<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #74b9ff, #0984e3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .weather-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        input {
            padding: 10px;
            width: 200px;
            border: 2px solid #0984e3;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        #result { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="weather-box">
        <h2>🌤️ Weather App</h2>
        <input type="text" id="city" placeholder="Enter City Name">
        <button onclick="getWeather()">Search</button>
        <div id="result">City peru ivvu</div>
    </div>

    <script>
        function getWeather() {
            let city = document.getElementById('city').value;
            document.getElementById('result').innerHTML = 
            `Searching weather for <b>${city}</b>...<br>API Key add cheste real data vastundi`;
        }
    </script>
</body>
</html>
